# Copy of the base settings for autonomous experiments.
# Adjust serial device, wheel geometry, motor direction, and covariances from measurements.
velocity_control_node:
  ros__parameters:
    usb_dev: /dev/ttyUSB0
    max_check: 2
    command_timeout: 0.5
    motor_update_period: 0.02
    online_timeout: 0.5

two_wheels_robot_node:
  ros__parameters:
    wheel_base: 0.208
    R_wheel: 0.050
    pub_tf: true
    update_period: 0.02
    feedback_timeout: 0.2
    enable_joystick: false
    left_motor_id: 1
    right_motor_id: 2
    left_direction: 1
    right_direction: -1
    odom_frame: odom
    base_frame: base_link
    pose_xy_covariance: 0.01
    pose_yaw_covariance: 0.02
    twist_linear_covariance: 0.01
    twist_angular_covariance: 0.02
