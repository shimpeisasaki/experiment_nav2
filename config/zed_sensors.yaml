/**:
  ros__parameters:
    general:
      grab_resolution: 'HD720'
      grab_frame_rate: 30
    video:
      publish_rgb: true
    depth:
      publish_depth_map: true
      publish_point_cloud: true
      point_cloud_freq: 10.0
    sensors:
      publish_imu: true
      publish_imu_raw: true
      publish_cam_imu_transf: true
      sensors_pub_rate: 100.0
    pos_tracking:
      pos_tracking_enabled: true
      imu_fusion: true
      publish_odom_pose: true
      publish_pose_cov: true
      publish_tf: false
      publish_map_tf: false
      # Independent VIO origin; do not label it as the wheel odom origin.
      odometry_frame: zed_odom
      map_frame: zed_map
      area_memory: false
      reset_odom_with_loop_closure: false
    gnss_fusion:
      gnss_fusion_enabled: false
